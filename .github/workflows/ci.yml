name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
          pip install -r indexer/requirements.txt -r indexer/requirements-dev.txt
          pip install pyyaml httpx

      - name: Run Ruff Linter
        run: |
          ruff check api indexer eval corpus

      - name: Run mypy Type Checking on API
        run: |
          cd api && mypy app --ignore-missing-imports

      - name: Run mypy Type Checking on Indexer
        run: |
          cd indexer && mypy pipeline --ignore-missing-imports

  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
          pip install -r indexer/requirements.txt -r indexer/requirements-dev.txt
          pip install pytest-cov

      - name: Run Pytest on API with Coverage
        run: |
          cd api && pytest -v --cov=app --cov-report=term-missing

      - name: Run Pytest on Indexer
        run: |
          cd indexer && pytest -v

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Install Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Manifests with Kubeconform
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.0

  build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        run: |
          docker build -t rahbar-api:${{ github.sha }} api

      - name: Build Indexer Image
        run: |
          docker build -t rahbar-indexer:${{ github.sha }} indexer

      - name: Build UI Image
        run: |
          docker build -t rahbar-ui:${{ github.sha }} ui

  scan:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image for scan
        run: |
          docker build -t rahbar-api:${{ github.sha }} api

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rahbar-api:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  e2e-eval:
    name: End-to-End Evaluation Gate
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kind-e2e

      - name: Build local images
        run: |
          docker build -t rahbar-api:dev api
          docker build -t rahbar-indexer:dev indexer
          docker build -t rahbar-ui:dev ui

      - name: Load images into KinD
        run: |
          kind load docker-image rahbar-api:dev --name kind-e2e
          kind load docker-image rahbar-indexer:dev --name kind-e2e
          kind load docker-image rahbar-ui:dev --name kind-e2e

      - name: Deploy Kubernetes stack
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="ci-dummy-key" --dry-run=client -o yaml | kubectl apply -f -

      - name: Run Indexer Job on Fixture Corpus
        run: |
          kubectl wait --for=condition=ready pod -l app=chroma -n rahbar --timeout=120s
          kubectl create job --from=cronjob/reindex fixture-indexer-job -n rahbar
          kubectl wait --for=condition=complete job/fixture-indexer-job -n rahbar --timeout=180s

      - name: Wait for API Rollout
        run: |
          kubectl rollout status deployment/rahbar-api -n rahbar --timeout=180s

      - name: Port-forward API & Run eval gate
        run: |
          kubectl port-forward svc/rahbar-api 8000:8000 -n rahbar &
          sleep 5
          python eval/run_eval.py --api http://localhost:8000 --golden eval/fixtures/golden.fixture.yaml
