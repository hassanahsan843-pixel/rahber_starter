name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Regression Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
          pip install -r indexer/requirements.txt -r indexer/requirements-dev.txt
          pip install pytest-cov

      - name: Run Pytest on API
        run: |
          cd api && pytest -v --cov=app

      - name: Run Pytest on Indexer
        run: |
          cd indexer && pytest -v

  build-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}

      - name: Build and Push Indexer Image
        uses: docker/build-push-action@v5
        with:
          context: indexer
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}

      - name: Build and Push UI Image
        uses: docker/build-push-action@v5
        with:
          context: ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    name: Deploy & Ingress Smoke Test
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup KinD Ephemeral Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kind-cd

      - name: Install Ingress NGINX on KinD
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=180s

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Apply Manifests
        run: |
          kubectl apply -k k8s/overlays/prod
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="${{ secrets.LLM_API_KEY || 'cd-deploy-key' }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Set Deployed Image SHA Tags
        run: |
          cd k8s/overlays/prod
          kustomize edit set image rahbar-api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          kustomize edit set image rahbar-indexer=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          kustomize edit set image rahbar-ui=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
          kustomize build . | kubectl apply -f -

      - name: Wait for API Rollout Status
        run: |
          kubectl rollout status deployment/rahbar-api -n rahbar --timeout=180s
          kubectl rollout status deployment/rahbar-ui -n rahbar --timeout=180s

      - name: Smoke Test through Ingress
        run: |
          kubectl port-forward -n ingress-nginx svc/ingress-nginx-controller 8080:80 &
          sleep 5
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: rahbar.local" http://localhost:8080/healthz)
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: Ingress route on rahbar.local returned $STATUS_CODE"
            exit 1
          fi
          echo "Smoke test passed: API is healthy and reachable through Ingress on rahbar.local!"
