apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  # Retrieval and Generation configuration (sections 3.2, 3.4)
  RETRIEVER: "chroma"
  LLM_PROVIDER: "stub"
  LLM_MODEL: "openai/gpt-oss-20b"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"

  # Embedding model pin - both indexer and api MUST use this exact model (section 4.4)
  EMBED_MODEL: "nomic-embed-text"
  
  # Chroma vector store configuration
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  
  # Semantic cache configuration (section 3.3)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_THRESHOLD: "0.90"
  
  # Retrieval and Generation parameters (sections 3.2, 3.4)
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.50"
  TEMPERATURE: "0.2"
  OLLAMA_URL: "offline"
  
  # Chunking configuration (section 3.1)
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  CORPUS_DIR: "/corpus"
  LOG_LEVEL: "INFO"

  # A03: RAGOps paths (sections A, D, E)
  DATA_LAKE_DIR: "/data_lake"
  QUARANTINE_DIR: "/quarantine"
  ARCHIVE_DIR: "/archive"
  TRACE_FILE: "/traces/traces.jsonl"
  TRACE_ENABLED: "true"

  # A03: Verification thresholds
  NEAR_DUPLICATE_THRESHOLD: "0.97"
  COVERAGE_THRESHOLD: "0.65"
