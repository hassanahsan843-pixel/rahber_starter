apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahbar-ui
  namespace: rahbar
  labels:
    app: rahbar-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rahbar-ui
  template:
    metadata:
      labels:
        app: rahbar-ui
    spec:
      serviceAccountName: rahbar-ui-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: ui
          image: rahbar-ui:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 20
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
