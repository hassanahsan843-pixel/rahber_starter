apiVersion: batch/v1
kind: Job
metadata:
  name: rahbar-indexer
  namespace: rahbar
  labels:
    app: rahbar-indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: rahbar-indexer
    spec:
      serviceAccountName: rahbar-indexer-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: corpus-volume
              mountPath: /corpus
            - name: datalake
              mountPath: /data_lake
            - name: quarantine
              mountPath: /quarantine
            - name: archive
              mountPath: /archive
            - name: traces
              mountPath: /traces
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: corpus-volume
          configMap:
            name: rahbar-corpus
        - name: datalake
          persistentVolumeClaim:
            claimName: datalake-pvc
        - name: quarantine
          persistentVolumeClaim:
            claimName: quarantine-pvc
        - name: archive
          persistentVolumeClaim:
            claimName: archive-pvc
        - name: traces
          persistentVolumeClaim:
            claimName: traces-pvc
