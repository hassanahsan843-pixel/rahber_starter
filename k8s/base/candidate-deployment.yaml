apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahbar-api-candidate
  namespace: rahbar
  labels:
    app: rahbar-api-candidate
    component: candidate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rahbar-api-candidate
  template:
    metadata:
      labels:
        app: rahbar-api-candidate
        component: candidate
    spec:
      serviceAccountName: rahbar-api-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: rahbar-api:a03
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: LLM_API_KEY
                  optional: true
            # Same Secret key as the baseline API and the indexers: the candidate
            # indexer invalidates this API's cache after building rahbar-candidate.
            - name: CACHE_INVALIDATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: CACHE_INVALIDATION_TOKEN
            # Override: candidate uses smaller chunks and separate collection
            - name: CHROMA_COLLECTION
              value: "rahbar-candidate"
            - name: CHUNK_SIZE
              value: "200"
            - name: CHUNK_OVERLAP
              value: "30"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: traces
              mountPath: /traces
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: traces
          persistentVolumeClaim:
            claimName: traces-pvc
