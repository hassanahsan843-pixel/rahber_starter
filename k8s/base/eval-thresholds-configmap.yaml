apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-thresholds
  namespace: rahbar
  labels:
    app: rahbar
    component: eval
data:
  thresholds.yaml: |
    # Release gate thresholds (Part C2)
    # Candidate must beat baseline by no more than these drops.
    recall_at_5_max_drop: 0.05
    mrr_max_drop: 0.05
    ndcg_max_drop: 0.05
    faithfulness_min: 0.60
    abstention_rate_max: 0.30
    p95_latency_max_seconds: 10.0
    # Embedding quality
    paraphrase_similarity_min: 0.80
    unrelated_similarity_max: 0.30
    embed_determinism: true
