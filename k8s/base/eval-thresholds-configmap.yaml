apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-thresholds
  namespace: rahbar
  labels:
    app: rahbar
    component: eval
data:
  thresholds.yaml: |
    recall_at_5_min_drop: 0.05
    recall_at_3_min: 0.50
    mrr_min: 0.40
    ndcg_at_5_min: 0.40
    faithfulness_min: 0.60
    citation_validity_min: 0.90
    abstention_correctness_min: 1.0
    latency_p95_max_s: 10.0