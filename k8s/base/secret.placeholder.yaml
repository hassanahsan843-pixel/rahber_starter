# Placeholder Secret for local documentation only.
# NEVER include this file in kustomization.yaml, as applying it will overwrite your live secret.
# Real secret is created via (both keys are required; see `make secret`):
#   kubectl create secret generic rahbar-secret -n rahbar \
#     --from-literal=LLM_API_KEY="..." --from-literal=CACHE_INVALIDATION_TOKEN="..."
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
  # Shared by the API Deployments and every indexer Job; any long random string.
  CACHE_INVALIDATION_TOKEN: "REPLACE_ME"
