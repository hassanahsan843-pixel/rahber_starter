apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rahbar-api-hpa
  namespace: rahbar
  labels:
    app: rahbar-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rahbar-api
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
