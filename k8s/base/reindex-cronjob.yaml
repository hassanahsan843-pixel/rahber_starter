apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app: rahbar-reindex
spec:
  schedule: "0 3 * * 0"  # Weekly: every Sunday at 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: rahbar-indexer
        spec:
          serviceAccountName: rahbar-indexer-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - configMapRef:
                    name: rahbar-config
              env:
                - name: CACHE_INVALIDATION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: rahbar-secret
                      key: CACHE_INVALIDATION_TOKEN
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 1024Mi
              volumeMounts:
                - mountPath: /tmp
                  name: tmp-dir
                - mountPath: /corpus
                  name: corpus-volume
                  readOnly: true
                - name: datalake
                  mountPath: /data_lake
                - name: quarantine
                  mountPath: /quarantine
                - name: archive
                  mountPath: /archive
                - name: traces
                  mountPath: /traces
          volumes:
            - name: tmp-dir
              emptyDir: {}
            - name: corpus-volume
              configMap:
                name: rahbar-corpus
            - name: datalake
              persistentVolumeClaim:
                claimName: datalake-pvc
            - name: quarantine
              persistentVolumeClaim:
                claimName: quarantine-pvc
            - name: archive
              persistentVolumeClaim:
                claimName: archive-pvc
            - name: traces
              persistentVolumeClaim:
                claimName: traces-pvc
