apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar-ingress
  namespace: rahbar
  labels:
    app: rahbar-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rahbar-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rahbar-ui
                port:
                  number: 80
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rahbar-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rahbar-ui
                port:
                  number: 80
