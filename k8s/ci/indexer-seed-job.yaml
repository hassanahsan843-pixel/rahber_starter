apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-seed
  namespace: rahbar
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: rahbar-indexer
    spec:
      serviceAccountName: rahbar-indexer-sa
      restartPolicy: OnFailure
      containers:
        - name: indexer-seed
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pipeline.run"]
          env:
            - name: CHROMA_HOST
              value: chroma
            - name: CHROMA_PORT
              value: "8000"
            - name: CHROMA_COLLECTION
              value: rahbar
            - name: EMBED_MODEL
              value: nomic-embed-text
            - name: CORPUS_DIR
              value: /corpus
          volumeMounts:
            - name: corpus-vol
              mountPath: /corpus
      volumes:
        - name: corpus-vol
          configMap:
            name: fixture-corpus
